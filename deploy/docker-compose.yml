services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xray_control
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray -d xray_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://xray:xray@postgres:5432/xray_control
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - xray_ssh_key

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_BASE: /api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

secrets:
  xray_ssh_key:
    file: ./secrets/xray_ssh_key
